- id: sas-82
  title: Consideration of Fraud in a Financial Statement Audit
  issuer: AICPA
  designation: Statement on Auditing Standards No. 82 (AU 316)
  category: audit_and_controls
  post_enron: false
  issued: "1997-02"
  effective: null
  effective_note: >-
    Issued by the Auditing Standards Board in February 1997, superseding SAS
    53. It is commonly cited as effective for audits of periods ending on or
    after December 15, 1997, but the only source found printed "on or
    before" (apparently a typo), so the effective date is left null.
  superseded_by: SAS No. 99 (October 2002)
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The fraud-risk standard Arthur Andersen worked under for Enron's
    1997-2000 audits. Andersen also gave structuring advice on the
    transactions it audited: the Powers Report says Enron's records show
    Andersen billed $5.7 million for advice on the LJM and Chewco
    transactions alone, on top of audit fees.
  process_areas: [audit_controls]
  today:
    codification: PCAOB AS 2401
    note: >-
      SAS 99 (October 2002; periods beginning on or after Dec 15, 2002)
      required brainstorming, journal-entry testing and management-override
      procedures. For public companies it is now PCAOB AS 2401.
  sources:
    - https://en.wikipedia.org/wiki/Statement_on_Auditing_Standards_No._99:_Consideration_of_Fraud
    - https://www.journalofaccountancy.com/issues/2002/may/auditorsnewproceduresfordetectingfraud.html
