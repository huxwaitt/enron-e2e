# Enron-era standards catalog (c. 1997 - Dec 2001), with post-Enron reforms.
#
# Each record maps a standard that governed work in Enron's spreadsheets to
# what governs the same topic today. See standards/sources.md for the
# bibliography and conventions.
#
# Conventions
#   - Dates are ISO-8601 strings. Where only the month or year is known from
#     the source, the value is truncated ("1998-06", "1992").
#   - `effective` is the date relevant to a calendar-year SEC registrant like
#     Enron (first day of the first period the standard applied), unless the
#     standard is transaction-based, in which case it is the first transaction
#     date covered. `effective_note` carries the official wording.
#   - `unverified: true` marks a record with at least one field we could not
#     confirm from a source; `unverified_fields` names them. Unconfirmed
#     values are null rather than guessed.
#   - `post_enron: true` marks reforms adopted after Enron's Dec 2, 2001
#     bankruptcy, kept here so readers can see the before/after.
#   - category: one of accounting_recognition, accounting_disclosure,
#     derivatives_and_hedging, energy_trading, consolidation_and_spe,
#     regulatory_reporting, regulated_utility_accounting,
#     contracts_master_agreements, market_conventions, audit_and_controls, tax
#   - process_areas: deal_capture, confirmation, risk_and_valuation,
#     scheduling_logistics, settlement, credit, accounting_r2r,
#     consolidation_reporting, regulatory_reporting, fpa, treasury, tax,
#     audit_controls

# ---------------------------------------------------------------------------
# Energy trading, derivatives and fair value
# ---------------------------------------------------------------------------

- id: eitf-98-10
  title: Accounting for Contracts Involved in Energy Trading and Risk Management Activities
  issuer: EITF
  designation: EITF Issue No. 98-10
  category: energy_trading
  post_enron: false
  issued: "1998-11-19"
  effective: "1999-01-01"
  effective_note: >-
    Consensus reached at the November 18-19, 1998 EITF meeting. Applied to
    financial statements for fiscal years beginning after December 15, 1998;
    initial effect reported as a cumulative effect of a change in accounting
    principle (APB 20), no restatement of prior periods.
  superseded_by: eitf-02-3
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The basis for Enron's mark-to-market accounting: forwards, swaps, options
    and energy transportation contracts held for trading were carried at fair
    value as "Assets/Liabilities from Price Risk Management Activities", with
    unrealized gains from newly originated contracts, restructurings and price
    moves booked in "Other Revenues" (2000 10-K, Note 1). The scope covered
    capacity, transportation and requirements contracts, and the commodity
    component of Enron Energy Services outsourcing deals. That let Enron book
    long-dated, thinly traded contracts at management's estimate of fair
    value. Enron had used mark-to-market for gas trading since the SEC staff
    accepted it in early 1992.
  process_areas: [deal_capture, risk_and_valuation, accounting_r2r, consolidation_reporting]
  today:
    codification: ASC 815; ASC 820
    note: >-
      EITF 02-3 rescinded 98-10 in October 2002. Energy contracts that are not
      derivatives went back to accrual accounting (or to ASC 606 / ASC 842 as
      applicable). Derivatives are fair-valued under ASC 815, with fair value
      measured and disclosed under ASC 820 (Level 1/2/3 hierarchy).
  sources:
    - https://www.cs.trinity.edu/rjensen/000overview/mp3/bookout.htm
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt
    - https://media.corporate-ir.net/media_files/irol/89/89455/reports/2002_annual/page62.html
    - https://en.wikipedia.org/wiki/Enron_scandal

- id: fas-133
  title: Accounting for Derivative Instruments and Hedging Activities
  issuer: FASB
  designation: SFAS No. 133 (as deferred by SFAS No. 137)
  category: derivatives_and_hedging
  post_enron: false
  issued: "1998-06"
  effective: "2001-01-01"
  effective_note: >-
    Originally effective for fiscal years beginning after June 15, 1999.
    SFAS 137 (June 1999) deferred it to all fiscal quarters of fiscal years
    beginning after June 15, 2000. Enron adopted it on January 1, 2001 (no
    early adoption).
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Enron adopted SFAS 133 on January 1, 2001. It recorded an after-tax
    cumulative-effect loss of about $5 million in earnings and a gain of about
    $22 million in OCI, and reclassified $532 million from long-term debt to
    other liabilities. Its 2000 10-K said the final impact depended on pending
    FASB interpretations of "normal purchases and normal sales" and of
    inflation escalators in contracts. Hedge designation and effectiveness
    testing became a control point for the non-trading (asset and merchant
    investment) hedges.
  process_areas: [deal_capture, risk_and_valuation, accounting_r2r, treasury, consolidation_reporting]
  today:
    codification: ASC 815
    note: >-
      Still the core derivatives standard, now codified in ASC 815. Hedge
      accounting has since been amended (notably by ASU 2017-12), and the
      fair value measurement it relies on now comes from ASC 820.
  sources:
    - https://storage.fasb.org/fas133.pdf
    - https://storage.fasb.org/fas137.pdf
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt
    - https://www.journalofaccountancy.com/issues/1999/aug/news2-aug-1999/

- id: fas-138
  title: Accounting for Certain Derivative Instruments and Certain Hedging Activities (an amendment of FASB Statement No. 133)
  issuer: FASB
  designation: SFAS No. 138
  category: derivatives_and_hedging
  post_enron: false
  issued: "2000-06"
  effective: "2001-01-01"
  effective_note: >-
    Effective for all fiscal quarters beginning after June 15, 2000, alongside
    SFAS 133 for entities that had not yet adopted 133. For Enron this was the
    January 1, 2001 adoption.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Amended SFAS 133 before Enron adopted it, including the normal purchases
    and normal sales scope exception that decided whether physical gas and
    power supply contracts were derivatives carried at fair value or accrual
    contracts. Enron's 2000 10-K named this area as an open interpretive
    question affecting its adoption estimate.
  process_areas: [deal_capture, risk_and_valuation, accounting_r2r]
  today:
    codification: ASC 815-10-15 (normal purchases and normal sales scope exception)
    note: >-
      Folded into ASC 815. Designating normal purchases and normal sales
      contracts is still a documented election that deal capture has to
      record at inception.
  sources:
    - https://storage.fasb.org/fas138.pdf
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt

- id: eitf-02-3
  title: Issues Involved in Accounting for Derivative Contracts Held for Trading Purposes and Contracts Involved in Energy Trading and Risk Management Activities
  issuer: EITF
  designation: EITF Issue No. 02-3
  category: energy_trading
  post_enron: true
  issued: "2002-10-25"
  effective: "2002-10-25"
  effective_note: >-
    At its October 25, 2002 meeting the EITF rescinded Issue 98-10. Contracts
    entered into after that date that are outside SFAS 133 could no longer be
    marked to market through earnings. Energy trading contracts and
    derivatives, whether settled physically or financially, were to be shown
    net in the income statement from January 1, 2003. Footnote 3 barred
    day-one (inception) gains unless fair value came from a quoted market
    price or other observable data.
  superseded_by: fas-157 (footnote 3 nullified); otherwise codified in ASC 815
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    The direct accounting response to Enron. It ended mark-to-market for
    non-derivative energy contracts (such as Enron's long-term outsourcing and
    transportation deals), which removed the main way such deals produced
    day-one earnings. It also ended the gross revenue presentation that made
    Enron's 2000 revenues $100.8 billion.
  process_areas: [deal_capture, risk_and_valuation, accounting_r2r, consolidation_reporting]
  today:
    codification: ASC 815; ASC 820
    note: >-
      The net-presentation and no-mark-to-market-for-non-derivatives results
      carried into ASC 815. The day-one gain prohibition in footnote 3 was
      nullified by SFAS 157 (2006). Inception gains are now judged under the
      ASC 820 hierarchy, with heavy disclosure for Level 3.
  sources:
    - https://www.cfo.com/news/enrons-derivative-accounting-legacy/678056/
    - https://media.corporate-ir.net/media_files/irol/89/89455/reports/2002_annual/page62.html
    - https://storage.fasb.org/fas157.pdf

- id: fas-157
  title: Fair Value Measurements
  issuer: FASB
  designation: SFAS No. 157
  category: accounting_disclosure
  post_enron: true
  issued: "2006-09"
  effective: "2008-01-01"
  effective_note: >-
    Effective for financial statements issued for fiscal years beginning after
    November 15, 2007, and interim periods within those years (January 1, 2008
    for calendar-year entities).
  superseded_by: null
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    The "after" picture for Enron's curve-and-model valuations. Under it, most
    of Enron's long-dated, illiquid regional power and gas positions would
    have been Level 3 measurements, with required roll-forwards and
    disclosure of unobservable inputs. Enron's own disclosures said only that
    prices reflected "management's best estimate".
  process_areas: [risk_and_valuation, accounting_r2r, consolidation_reporting]
  today:
    codification: ASC 820
    note: >-
      Codified as ASC 820. It nullified EITF 02-3 footnote 3, so day-one gains
      can be recognized when the measurement supports them; SEC staff warned
      in 2006 that this was not a license to "mark to model". Later
      amendments (for example ASU 2011-04) expanded Level 3 disclosures.
  sources:
    - https://storage.fasb.org/fas157.pdf
    - https://www.sec.gov/news/speech/2006/spch121106jdm.htm

- id: fas-107
  title: Disclosures about Fair Value of Financial Instruments
  issuer: FASB
  designation: SFAS No. 107
  category: accounting_disclosure
  post_enron: false
  issued: "1991-12"
  effective: "1992-12-31"
  effective_note: >-
    Effective for financial statements issued for fiscal years ending after
    December 15, 1992. Entities with less than $150 million in total assets
    were allowed a later date.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Required fair value disclosure for financial instruments not already
    carried at fair value, such as Enron's debt, notes receivable and
    non-trading instruments. This supported the price risk management and
    financial instrument notes in the 10-K.
  process_areas: [risk_and_valuation, treasury, consolidation_reporting]
  today:
    codification: ASC 825-10-50
    note: >-
      Still required, now in ASC 825, and measured on the ASC 820 basis.
      Disclosure relief for certain entities followed later (ASU 2016-01).
  sources:
    - https://storage.fasb.org/fas107.pdf

- id: sec-sk-item-305
  title: Quantitative and Qualitative Disclosures about Market Risk
  issuer: SEC
  designation: Regulation S-K Item 305 (Release Nos. 33-7386; 34-38223)
  category: regulatory_reporting
  post_enron: false
  issued: "1997-01-28"
  effective: "1997-12-31"
  effective_note: >-
    Adopted January 28, 1997 (62 FR, Feb 10, 1997). Item 305 applied to
    filings with annual financial statements for fiscal years ending after
    June 15, 1997 for registrants with market cap above $2.5 billion; smaller
    registrants were phased in a year later. Enron was in the first group,
    so its first Item 305 disclosure was for fiscal year ended December 31,
    1997.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The source of Enron's Item 7A "Financial Risk Management" section. Enron
    used the value-at-risk alternative, reporting entity-wide VaR for
    commodity, interest rate, foreign currency and equity exposures. It also
    noted the limits of VaR and that it did not capture liquidity or event
    risk.
  process_areas: [risk_and_valuation, regulatory_reporting, consolidation_reporting]
  today:
    codification: Regulation S-K Item 305 (17 CFR 229.305)
    note: >-
      Largely unchanged. Exposures that VaR does not capture, such as Level 3
      positions and liquidity, are now covered through ASC 820 disclosures,
      MD&A liquidity discussion and SEC comment-letter practice.
  sources:
    - https://www.sec.gov/rules/final/33-7386.htm
    - https://www.govinfo.gov/content/pkg/FR-1997-02-10/html/97-2991.htm
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt

# ---------------------------------------------------------------------------
# Consolidation, SPEs, transfers of financial assets
# ---------------------------------------------------------------------------

- id: arb-51
  title: Consolidated Financial Statements (as amended by SFAS 94, Consolidation of All Majority-owned Subsidiaries)
  issuer: AICPA
  designation: ARB No. 51; SFAS No. 94 (FASB)
  category: consolidation_and_spe
  post_enron: false
  issued: "1959-08"
  effective: "1959-08"
  effective_note: >-
    ARB 51 was issued and effective in August 1959 (Committee on Accounting
    Procedure, AICPA). SFAS 94 (October 1987) amended it to require
    consolidation of all majority-owned subsidiaries, effective for fiscal
    years ending after December 15, 1988.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The voting-control consolidation model, with its presumption that
    consolidated statements are more meaningful, is the baseline the Powers
    Report used to judge Enron's SPEs. Because Enron's SPEs were not
    majority-owned voting entities, their treatment turned on the
    SPE-specific exceptions (EITF 90-15, Topic D-14) rather than on ARB 51
    itself.
  process_areas: [consolidation_reporting, accounting_r2r]
  today:
    codification: ASC 810-10
    note: >-
      Voting-interest consolidation remains in ASC 810-10. Entities without
      sufficient at-risk equity or with non-voting control are now handled by
      the variable interest entity model (FIN 46/46(R), SFAS 167 / ASU
      2009-17).
  sources:
    - https://storage.fasb.org/ARB%2051.pdf
    - https://storage.fasb.org/fas94.pdf
    - https://www.sec.gov/Archives/edgar/data/1024401/000090951802000089/0000909518-02-000089.txt

- id: apb-18
  title: The Equity Method of Accounting for Investments in Common Stock
  issuer: AICPA
  designation: APB Opinion No. 18
  category: consolidation_and_spe
  post_enron: false
  issued: "1971-03"
  effective: null
  effective_note: >-
    Issued by the Accounting Principles Board in March 1971. The original
    effective date was not checked against the source text.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Enron accounted for its unconsolidated affiliates (for example JEDI before
    the restatement, Whitewing and many international project companies) by
    the equity method. The exception was investments from its merchant
    activities, which it carried at market value in "Other Investments".
    Where acquired assets were held under "temporary control", Enron
    recognized earnings only for the portion it intended to keep.
  process_areas: [consolidation_reporting, accounting_r2r]
  today:
    codification: ASC 323
    note: >-
      The equity method itself is largely unchanged since 1971. Simplifying
      amendments include ASU 2016-07, which removed retroactive adoption when
      an investment qualifies for the equity method.
  sources:
    - https://en.wikipedia.org/wiki/List_of_Accounting_Principles_Board_Opinions
    - https://people.wku.edu/jack.hall/apb18.htm
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt
  unverified: true
  unverified_fields: [effective]

- id: eitf-90-15
  title: Impact of Nonsubstantive Lessors, Residual Value Guarantees, and Other Provisions in Leasing Transactions
  issuer: EITF
  designation: EITF Issue No. 90-15 (with implementation guidance in EITF 96-21)
  category: consolidation_and_spe
  post_enron: false
  issued: null
  effective: null
  effective_note: >-
    EITF 90-15 dates from 1990-91 by its issue number, but the exact consensus
    and effective dates were not confirmed. EITF 96-21 ("Implementation
    Issues in Accounting for Leasing Transactions involving Special-Purpose
    Entities") supplemented it.
  superseded_by: fin-46
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Source of the "3 percent" outside equity test that practice applied to
    Enron's non-consolidated SPEs. Chewco failed it: part of the required 3%
    came from an Enron-affiliated person and part was not at risk. Enron
    therefore consolidated Chewco and JEDI back to November 1997 in its
    November 2001 restatement, raising reported debt by $711 million in 1997
    and $628 million in 2000.
  process_areas: [consolidation_reporting, accounting_r2r, treasury, audit_controls]
  today:
    codification: ASC 810-10 (Variable Interest Entities subsections); ASC 842
    note: >-
      FIN 46 (January 2003) nullified EITF 90-15 and most of 96-21. It stated
      that the 3% requirement was superseded and that 3% equity is
      insufficient for many VIEs, with a 10% presumption. Lease
      classification moved to ASC 842 (ASU 2016-02), which put most leases on
      the balance sheet.
  sources:
    - https://storage.fasb.org/fin46.pdf
    - https://law-journals-books.vlex.com/vid/consolidate-special-purpose-entity-54502958
    - https://corporate.findlaw.com/business-operations/the-synthetic-lease-an-introduction-and-practice-guide.html
    - https://www.sec.gov/Archives/edgar/data/1024401/000090951802000089/0000909518-02-000089.txt
  unverified: true
  unverified_fields: [issued, effective]

- id: eitf-topic-d-14
  title: Transactions involving Special-Purpose Entities
  issuer: EITF
  designation: EITF Topic No. D-14 (SEC staff announcement)
  category: consolidation_and_spe
  post_enron: false
  issued: null
  effective: null
  effective_note: >-
    An SEC staff announcement developed over several EITF meetings. The date
    of the announcement was not confirmed.
  superseded_by: fin-46
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Recorded the SEC staff position that an independent owner's substantive
    equity investment of at least 3% of total capital was the minimum to
    avoid consolidation, and that the right level depends on the facts. The
    independent owner also had to control the SPE, and the equity had to stay
    at risk throughout. The Powers Report applied this test to Chewco, LJM1,
    LJM2, Swap Sub and the Raptors.
  process_areas: [consolidation_reporting, accounting_r2r, audit_controls]
  today:
    codification: ASC 810-10 (VIE model)
    note: >-
      FIN 46 nullified Topic D-14. Today the primary beneficiary of a VIE (the
      party with power over its most significant activities plus exposure to
      significant losses or benefits) consolidates it, with ongoing
      reassessment and extensive disclosure.
  sources:
    - https://storage.fasb.org/fin46.pdf
    - https://storage.fasb.org/fas140.pdf
    - https://www.sec.gov/Archives/edgar/data/1024401/000090951802000089/0000909518-02-000089.txt
  unverified: true
  unverified_fields: [issued, effective]

- id: fas-125
  title: Accounting for Transfers and Servicing of Financial Assets and Extinguishments of Liabilities
  issuer: FASB
  designation: SFAS No. 125
  category: consolidation_and_spe
  post_enron: false
  issued: "1996-06"
  effective: "1997-01-01"
  effective_note: >-
    Effective for transfers and servicing of financial assets and
    extinguishments of liabilities occurring after December 31, 1996, applied
    prospectively. Certain provisions were deferred.
  superseded_by: fas-140
  status_as_of_2001-12-31: superseded
  enron_relevance: >-
    Set the sale-accounting criteria (surrender of control, isolation) and the
    qualifying-SPE concept behind Enron's "monetizations" of merchant
    investments and other financial assets in 1997-2000. In Enron's
    securitizations the seller entered into swaps on the underlying assets
    at the same time, which limited the purchaser's risk and left exposure
    with Enron (2000 10-K).
  process_areas: [treasury, accounting_r2r, consolidation_reporting]
  today:
    codification: ASC 860
    note: >-
      Replaced by SFAS 140 (2000) and then substantially amended by SFAS 166
      (2009), which eliminated the qualifying SPE concept. Now codified in ASC
      860.
  sources:
    - https://storage.fasb.org/fas125.pdf
    - https://www.fdic.gov/news/inactive-financial-institution-letters/1996/fil96109.pdf

- id: fas-140
  title: Accounting for Transfers and Servicing of Financial Assets and Extinguishments of Liabilities (a replacement of FASB Statement No. 125)
  issuer: FASB
  designation: SFAS No. 140
  category: consolidation_and_spe
  post_enron: false
  issued: "2000-09"
  effective: "2001-04-01"
  effective_note: >-
    Effective for transfers and servicing occurring after March 31, 2001.
    Recognition and reclassification of collateral, and the securitization
    disclosures, were effective for fiscal years ending after December 15,
    2000, so they applied to Enron's 2000 10-K.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Governed Enron's securitizations. In 2000 Enron reported $381 million of
    gains on securitization sales on $2,379 million of proceeds, including
    $545 million from sales to Whitewing. Enron usually entered into swaps
    with the purchaser at the same time, limiting the buyer's risk. The
    Powers Report describes LJM2 buying interests through such
    securitizations.
  process_areas: [treasury, accounting_r2r, consolidation_reporting, risk_and_valuation]
  today:
    codification: ASC 860
    note: >-
      SFAS 166 (ASU 2009-16) removed the qualifying SPE exception and
      tightened derecognition. Together with SFAS 167 (ASU 2009-17) it means
      securitization vehicles are assessed for consolidation under the VIE
      model.
  sources:
    - https://storage.fasb.org/fas140.pdf
    - https://www.fdic.gov/credit-card-securitization-manual/chapter-iii-accounting-credit-card-securitizations
    - https://storage.fasb.org/fas167.pdf
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt

- id: fin-46
  title: Consolidation of Variable Interest Entities (an interpretation of ARB No. 51), including FIN 46(R)
  issuer: FASB
  designation: FASB Interpretation No. 46; FIN 46(R) (revised December 2003)
  category: consolidation_and_spe
  post_enron: true
  issued: "2003-01-17"
  effective: "2003-02-01"
  effective_note: >-
    FIN 46 applied immediately to VIEs created after January 31, 2003, and to
    older VIEs from the first fiscal year or interim period beginning after
    June 15, 2003. FIN 46(R), issued December 2003, generally applied by
    periods ending after December 15, 2003 for SPEs and after March 15, 2004
    for other VIEs (public companies).
  superseded_by: fas-167
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    The FASB's main post-Enron fix. It replaced the voting and 3%
    outside-equity tests that Chewco, LJM and the Raptors were built around
    with consolidation by the primary beneficiary of a variable interest
    entity. It explicitly nullified EITF 90-15, Topic D-14 and most of EITF
    96-21.
  process_areas: [consolidation_reporting, accounting_r2r, audit_controls]
  today:
    codification: ASC 810-10 (VIE subsections)
    note: >-
      FIN 46(R)'s quantitative expected-loss test was replaced by SFAS 167's
      qualitative power-and-economics test (2009; ASU 2009-17), later refined
      by ASU 2015-02.
  sources:
    - https://storage.fasb.org/fin46.pdf
    - https://storage.fasb.org/fin46r.pdf
    - https://en.wikipedia.org/wiki/FIN_46

- id: fas-167
  title: Amendments to FASB Interpretation No. 46(R)
  issuer: FASB
  designation: SFAS No. 167 (codified by ASU 2009-17)
  category: consolidation_and_spe
  post_enron: true
  issued: "2009-06-12"
  effective: "2010-01-01"
  effective_note: >-
    Issued June 2009 and codified into ASC 810 by ASU 2009-17 (December 2009).
    Effective as of the beginning of the first annual reporting period that
    begins after November 15, 2009 (January 1, 2010 for calendar-year
    entities); earlier application prohibited.
  superseded_by: null
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    The current form of the VIE model. Consolidation turns on who has the
    power to direct the activities that most significantly affect a VIE's
    economics, which is the question the Powers Report raised about LJM2 and
    the Raptors. It also removed the QSPE carve-out (with SFAS 166).
  process_areas: [consolidation_reporting, accounting_r2r]
  today:
    codification: ASC 810-10
    note: >-
      Current GAAP (ASC 810-10, as amended by ASU 2015-02 and later
      related-party refinements).
  sources:
    - https://storage.fasb.org/fas167.pdf
    - https://viewpoint.pwc.com/dt/us/en/fasb_financial_accou/asus_fulltext/2009/asu_200917consolidat/asu_200917consolidat_US/asu_200917consolidat_US.html

- id: eitf-85-1
  title: Classifying Notes Received for Capital Stock
  issuer: EITF
  designation: EITF Issue No. 85-1
  category: accounting_recognition
  post_enron: false
  issued: null
  effective: null
  effective_note: >-
    Dates from 1985 by its issue number. The exact consensus date was not
    confirmed. The principle (notes received for a company's own stock are
    shown as a deduction from equity, not as an asset) is what Enron applied
    in its 2001 correction.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Enron issued its own stock and stock contracts to the Raptor SPEs in
    exchange for notes receivable and recorded both an asset and an increase
    in equity. That overstated notes receivable and equity by about $172
    million from Q2 2000, plus $828 million more from Q1 2001 contracts, $1
    billion in total. The correction was most of the $1.2 billion equity
    reduction Enron announced on October 16, 2001 (Nov 8, 2001 8-K).
  process_areas: [accounting_r2r, consolidation_reporting, treasury]
  today:
    codification: ASC 505-10-45-2
    note: >-
      Same principle in ASC 505-10-45-2; SEC registrants also follow SAB Topic
      4.E.
  sources:
    - https://www.sec.gov/Archives/edgar/data/1024401/000095012901503835/0000950129-01-503835.txt
    - https://www.sec.gov/Archives/edgar/data/1024401/000090951802000089/0000909518-02-000089.txt
    - https://www.oilandgasinvestor.com/exclusives/enrons-spes-andersen-sec-and-fasb-6526
  unverified: true
  unverified_fields: [issued, effective]

- id: eitf-00-19
  title: Accounting for Derivative Financial Instruments Indexed to, and Potentially Settled in, a Company's Own Stock
  issuer: EITF
  designation: EITF Issue No. 00-19
  category: derivatives_and_hedging
  post_enron: false
  issued: "2000-09-20"
  effective: "2000-09-20"
  effective_note: >-
    Final consensus reached September 20, 2000. It applied to new contracts
    from inception. Contracts already outstanding were grandfathered until
    June 30, 2001, with a cumulative catch-up adjustment at that date.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The era's guidance on classifying contracts settled in a company's own
    stock as equity or as an asset or liability. It bears on the Enron
    common stock and stock contracts that Enron issued to the Raptor
    vehicles (2000 and Q1 2001), which hedged Enron's merchant investments.
    Whether and how Enron applied 00-19 to these contracts was not
    verified.
  process_areas: [accounting_r2r, treasury, consolidation_reporting]
  today:
    codification: ASC 815-40
    note: >-
      Codified in ASC 815-40, partly nullified by SFAS 150 (2003) and
      simplified by ASU 2020-06.
  sources:
    - https://www.sec.gov/Archives/edgar/data/0001032033/000091205700050216/a2030171z10-q.txt
    - https://storage.fasb.org/aop_fas150.pdf
    - https://www.sec.gov/Archives/edgar/data/1024401/000095012901503835/0000950129-01-503835.txt
  unverified: true
  unverified_fields: [enron_relevance]

- id: sab-51
  title: Accounting for Sales of Stock by a Subsidiary
  issuer: SEC
  designation: Staff Accounting Bulletin No. 51 (SAB Topic 5.H)
  category: accounting_recognition
  post_enron: false
  issued: "1983"
  effective: null
  effective_note: >-
    Issued in 1983. The exact date was not confirmed.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Enron's stated policy: when a subsidiary issued stock above Enron's
    carrying amount per share, Enron recognized the difference as a gain
    ("SAB 51 gain") in income (2000 10-K, Note 1).
  process_areas: [accounting_r2r, consolidation_reporting]
  today:
    codification: ASC 810-10-45-23
    note: >-
      Since SFAS 160 (effective 2009), changes in a parent's ownership that do
      not lose control are equity transactions with no income-statement gain.
      SAB 112 (June 2009) conformed SEC staff guidance.
  sources:
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt
    - https://www.sec.gov/interps/account/sab112.htm
  unverified: true
  unverified_fields: [issued, effective]

