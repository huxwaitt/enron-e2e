- id: gisb-wgq-standards
  title: GISB natural gas business practice standards (nominations, gas day, flowing gas) as incorporated by FERC
  issuer: GISB/NAESB
  designation: GISB Standards (v1.0) incorporated by reference in FERC Order No. 587 (Docket RM96-1)
  category: market_conventions
  post_enron: false
  issued: "1996-07-17"
  effective: null
  effective_note: >-
    FERC Order No. 587, issued July 17, 1996 (61 FR 39053, July 26, 1996),
    incorporated GISB standards on nominations, flowing gas and related
    practices for interstate pipelines. The implementation date was not
    confirmed.
  superseded_by: NAESB WGQ standards (current versions incorporated by later Order 587-series rules)
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Defined the logistics conventions behind the gas scheduling workbooks: the
    gas day starting at 9:00 a.m. Central Clock Time, standard nomination
    cycles (Timely, Evening, Intraday) and confirmation and allocation
    practices. Enron's traders, schedulers and its own pipelines worked to
    these timelines.
  process_areas: [scheduling_logistics, settlement, confirmation]
  today:
    codification: 18 CFR 284.12 (incorporation of NAESB WGQ standards)
    note: >-
      Order 587 series continues. Order No. 809 (2015) moved the Timely
      Nomination deadline from 11:30 a.m. to 1:00 p.m. CCT. All NAESB times
      remain tied to Central Clock Time.
  sources:
    - https://www.govinfo.gov/content/pkg/FR-1996-10-25/html/96-27432.htm
    - https://ns.naesb.org/pdf4/ferc071521_final_rule_order587z.pdf
    - https://www.govinfo.gov/content/pkg/FR-2021-08-10/pdf/2021-16915.pdf
  unverified: true
  unverified_fields: [effective]

- id: nymex-henry-hub-natural-gas
  title: NYMEX Henry Hub Natural Gas Futures
  issuer: NYMEX
  designation: NYMEX Natural Gas (Henry Hub) futures contract (NG)
  category: market_conventions
  post_enron: false
  issued: "1990-04-03"
  effective: "1990-04-03"
  effective_note: >-
    Began trading April 3, 1990, with delivery at Sabine Pipe Line's Henry
    Hub, Louisiana. Options followed October 2, 1992. Contract size is 10,000
    MMBtu.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The benchmark for Enron's gas forward curves. Regional prices were marked
    as basis to Henry Hub, NYMEX settlements were the reference for daily
    P&L and VaR, and many Enron swaps and EnronOnline products priced off
    NYMEX last-day settlement.
  process_areas: [risk_and_valuation, deal_capture, settlement]
  today:
    codification: CME Group / NYMEX NG contract rules (Rulebook Chapter 220)
    note: >-
      Still the world's most-traded natural gas futures contract, now on CME
      Group's NYMEX (merged 2008).
  sources:
    - https://www.cmegroup.com/articles/whitepapers/henry-hub-natural-gas-futures-global-benchmark.html
    - https://www.cmegroup.com/openmarkets/commodities/2021/henry-hub-remains-the-center-of-natural-gas-markets.html
    - https://rbnenergy.com/henry-the-hub-i-am-i-am-the-evolution-of-the-natural-gas-benchmark

- id: nymex-electricity-futures-1996
  title: NYMEX electricity futures (California-Oregon Border and Palo Verde)
  issuer: NYMEX
  designation: NYMEX COB and Palo Verde electricity futures
  category: market_conventions
  post_enron: false
  issued: "1996-03-29"
  effective: "1996-03-29"
  effective_note: >-
    Trading began March 29, 1996, with options from April 26, 1996. The
    contract was 736 MWh per month (2 MW for 16 on-peak hours, 0600-2200).
    Eastern contracts followed about two years later.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Set the on-peak block convention (16-hour peak, monthly delivery) and the
    western hub reference points (COB, Palo Verde) used in Enron's West Power
    curves and deal tickets. Liquidity was thin, so marks relied heavily on
    OTC and broker quotes.
  process_areas: [risk_and_valuation, deal_capture, scheduling_logistics]
  today:
    codification: CME / ICE power futures and swaps (exchange rulebooks)
    note: >-
      Western power hub futures and swaps now trade and clear on ICE and CME.
      The 16-hour on-peak block convention persists.
  sources:
    - https://www.osti.gov/biblio/319013
    - https://www.govinfo.gov/content/pkg/FR-1995-08-31/html/95-21620.htm
    - https://www.fortnightly.com/fortnightly/1996/04/cftc-approves-nymex-futuresb-contracts

- id: gas-price-index-conventions
  title: Published natural gas price indices (Platts Inside FERC's Gas Market Report first-of-month index; Gas Daily daily index)
  issuer: Platts (McGraw-Hill)
  designation: Inside FERC's Gas Market Report bidweek (first-of-month) index; Gas Daily midpoint index
  category: market_conventions
  post_enron: false
  issued: null
  effective: null
  effective_note: >-
    Publisher indices compiled from confidential surveys of buyers and sellers
    (Inside FERC was published biweekly by Platts). The start dates of the
    indices were not confirmed.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Most physical gas deals, and the floating legs of many swaps in the
    corpus, priced at "IF" first-of-month or Gas Daily daily indices at
    specific hubs and pipeline points. At trial, the Inside FERC price editor
    testified that Enron trade data sometimes went into the index but that
    Enron did not control it.
  process_areas: [deal_capture, settlement, risk_and_valuation]
  today:
    codification: Platts / NGI index methodologies; FERC price index policy and 18 CFR 284.403
    note: >-
      Index publishers now operate under FERC's 2003 policy and later
      revisions, with methodology disclosure and safe-harbor reporting
      standards. Platts is now S&P Global Commodity Insights.
  sources:
    - https://www.naturalgasintel.com/price-editors-testify-to-editorial-checks-against-bogus-trades/
    - https://www.spglobal.com/energy/en/pricing-benchmarks/our-methodology/subscriber-notes/022626-preliminary-monthly-natural-gas-indexes-delayed-for-trade-date-feb-25
    - https://webarchive.library.unt.edu/eot2008/20090114222131/http:/www.ferc.gov/news/news-releases/2003/2003-3/07-23-03-indexgas.pdf
  unverified: true
  unverified_fields: [issued, effective]
