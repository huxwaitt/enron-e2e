- id: sab-101
  title: Revenue Recognition in Financial Statements
  issuer: SEC
  designation: Staff Accounting Bulletin No. 101 (as amended by SAB 101A and 101B)
  category: accounting_recognition
  post_enron: false
  issued: "1999-12-03"
  effective: "2000-10-01"
  effective_note: >-
    Released December 3, 1999. SAB 101A (March 24, 2000) and SAB 101B (June
    26, 2000) deferred implementation to no later than the fourth fiscal
    quarter of fiscal years beginning after December 15, 1999. For
    calendar-year registrants that was Q4 2000, with any change recorded as a
    cumulative effect as of the start of the year.
  superseded_by: SAB 104 (December 17, 2003)
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The SEC staff's general revenue recognition framework (persuasive
    evidence of an arrangement, delivery, fixed or determinable fee,
    collectibility) for Enron's non-trading revenues, such as pipeline,
    utility and services. Trading revenues followed the specific guidance in
    EITF 98-10.
  process_areas: [accounting_r2r, consolidation_reporting, settlement]
  today:
    codification: ASC 606
    note: >-
      SAB 104 (Dec 2003) revised SAB Topic 13. ASC 606 (ASU 2014-09, effective
      for public entities for annual periods beginning after Dec 15, 2017)
      replaced the SAB 101/104 and ASC 605 framework with the five-step
      contract model.
  sources:
    - https://www.sec.gov/interps/account/sab101b1.htm
    - https://www.govinfo.gov/content/pkg/FR-2000-07-03/pdf/00-16580.pdf
    - https://www.sec.gov/news/press/2003-174.htm
    - https://www.revenuehub.org/article/transition-dates-and-methods

- id: eitf-99-19
  title: Reporting Revenue Gross as a Principal versus Net as an Agent
  issuer: EITF
  designation: EITF Issue No. 99-19
  category: accounting_recognition
  post_enron: false
  issued: null
  effective: null
  effective_note: >-
    Consensus reached in 2000. The meeting date, believed to be July 2000, and
    the transition date, believed to coincide with SAB 101 implementation,
    were not confirmed.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Gross-versus-net presentation drove Enron's reported revenue: $100.8
    billion in 2000, up from $40.1 billion in 1999, almost all in Wholesale
    Services. Physical trading flows were recorded gross. EITF 02-3 later
    required energy trading to be shown net from 2003.
  process_areas: [accounting_r2r, consolidation_reporting, fpa]
  today:
    codification: ASC 606-10-55 (principal versus agent considerations)
    note: >-
      Principal-versus-agent analysis now sits in ASC 606 and is based on
      control of the good or service. Trading-book derivatives are presented
      net under ASC 815.
  sources:
    - https://www.sec.gov/info/accountants/staffletters/audrsk2k.htm
    - https://dart.deloitte.com/USDART/home/codification/revenue/asc606-10/roadmap-revenue-recognition/chapter-10-principal-versus-agent-considerations?combine
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt
  unverified: true
  unverified_fields: [issued, effective]

- id: fas-131
  title: Disclosures about Segments of an Enterprise and Related Information
  issuer: FASB
  designation: SFAS No. 131
  category: accounting_disclosure
  post_enron: false
  issued: "1997-06"
  effective: "1998-01-01"
  effective_note: >-
    Effective for fiscal years beginning after December 15, 1997, with
    restatement of comparative periods. It replaced SFAS 14.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Defined Enron's management-approach segments in the 2000 10-K:
    Transportation and Distribution, Wholesale Services, Retail Energy
    Services, Broadband Services, and Corporate and Other. The FP&A segment
    rollups in the spreadsheets map to these.
  process_areas: [fpa, consolidation_reporting, accounting_r2r]
  today:
    codification: ASC 280
    note: >-
      Still the management approach (ASC 280). ASU 2023-07 added disclosure of
      significant segment expenses and other items for fiscal years beginning
      after December 15, 2023.
  sources:
    - https://storage.fasb.org/fas131.pdf
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt

- id: fas-57
  title: Related Party Disclosures
  issuer: FASB
  designation: SFAS No. 57
  category: accounting_disclosure
  post_enron: false
  issued: "1982-03"
  effective: "1982-12-31"
  effective_note: >-
    Effective for financial statements for fiscal years ending after June 15,
    1982 (first calendar year-end: December 31, 1982).
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Required disclosure of the nature of related-party relationships,
    transaction descriptions, dollar amounts and balances. Enron's 2000 10-K
    Note 16 described LJM only as limited partnerships whose general
    partner's managing member was "a senior officer of Enron", without naming
    Fastow. The Powers Report concluded that, despite substantial disclosure,
    "the disclosures were fundamentally inadequate".
  process_areas: [consolidation_reporting, accounting_r2r, audit_controls]
  today:
    codification: ASC 850
    note: >-
      Largely unchanged in ASC 850. FIN 45 amended related-party guarantee
      disclosure. SOX §402 banned most personal loans to executives, and S-K
      Item 404 was rewritten in 2006.
  sources:
    - https://storage.fasb.org/fas57.pdf
    - https://dart.deloitte.com/USDART/home/codification/broad-transactions/asc850
    - https://www.sec.gov/Archives/edgar/data/1024401/000090951802000089/0000909518-02-000089.txt
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt

- id: sec-sk-item-404
  title: Certain Relationships and Related Transactions
  issuer: SEC
  designation: Regulation S-K Item 404
  category: regulatory_reporting
  post_enron: false
  issued: null
  effective: null
  effective_note: >-
    The pre-2006 rule in force in 2001 required disclosure of transactions
    over $60,000 in which an executive officer had a material interest. Its
    original adoption date was not confirmed.
  superseded_by: Item 404 as amended in 2006 (Release 33-8732)
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Governed proxy and 10-K disclosure of Fastow's interest in LJM. Enron
    incorporated the Item 404 discussion from its proxy by reference. The
    Powers Report faults the failure to disclose Fastow's compensation from
    LJM (later learned to exceed $30 million) even though Item 404 asked,
    "where practicable", for the amount of his interest.
  process_areas: [regulatory_reporting, consolidation_reporting]
  today:
    codification: Regulation S-K Item 404 (17 CFR 229.404)
    note: >-
      Amendments adopted July 26, 2006 raised the threshold from $60,000 to
      $120,000, consolidated Item 404(a), and added Item 404(b) on policies
      for reviewing and approving related-person transactions.
  sources:
    - https://www.sec.gov/Archives/edgar/data/1024401/000090951802000089/0000909518-02-000089.txt
    - https://www.dorsey.com/newsresources/publications/2006/10/action-items-for-related-person-transaction-disc__
    - https://dart.deloitte.com/USDART/home/accounting/sec/sec-material-supplement/current-accounting-disclosure-issues/nov-2006-current-accounting-disclosure-issues
  unverified: true
  unverified_fields: [issued, effective]

- id: sec-regulation-s-x
  title: Form and Content of Financial Statements (Regulation S-X), incl. Rule 4-08(k) related parties and Rule 3-09 equity investees
  issuer: SEC
  designation: Regulation S-X (17 CFR Part 210)
  category: regulatory_reporting
  post_enron: false
  issued: null
  effective: null
  effective_note: >-
    In force throughout the era. Adoption dates of the individual rules cited
    here were not confirmed.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Governed the form of Enron's 10-K and 10-Q statements. Rule 4-08(k)
    requires related-party amounts on the face of the statements (cited in
    the Powers Report). Separate financial statements of significant equity
    investees were filed as well: Enron's 2000 10-K included financial
    statements of Atlantic Water Trust (Azurix).
  process_areas: [consolidation_reporting, regulatory_reporting]
  today:
    codification: Regulation S-X (17 CFR Part 210)
    note: >-
      Still in force. SOX-era rules added Rule 2-01 independence changes and
      off-balance-sheet disclosure in S-K Item 303, and the significance tests
      were updated in 2020.
  sources:
    - https://www.sec.gov/Archives/edgar/data/1024401/000090951802000089/0000909518-02-000089.txt
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/0001024401-01-500010-index.htm
  unverified: true
  unverified_fields: [issued, effective]

- id: sec-fr-61
  title: Commission Statement about Management's Discussion and Analysis of Financial Condition and Results of Operations
  issuer: SEC
  designation: Release Nos. 33-8056; 34-45321 (FR-61)
  category: accounting_disclosure
  post_enron: true
  issued: "2002-01-22"
  effective: "2002-01-22"
  effective_note: >-
    An interpretive statement issued January 22, 2002 (67 FR 3746) in
    response to a December 31, 2001 petition from the Big-5 firms. It did not
    create new legal requirements.
  superseded_by: null
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    Issued seven weeks after Enron's bankruptcy. It told registrants to
    discuss liquidity and capital resources including off-balance-sheet
    arrangements, trading activities involving non-exchange-traded contracts
    carried at fair value, and related-party transactions on terms not
    available from independent third parties. Each was an Enron failure
    point.
  process_areas: [consolidation_reporting, regulatory_reporting, risk_and_valuation]
  today:
    codification: Regulation S-K Item 303 (MD&A)
    note: >-
      SOX §401(a) then required SEC rules on off-balance-sheet arrangements in
      MD&A (2003). The 2020 MD&A amendments restructured Item 303 into a
      principles-based requirement.
  sources:
    - https://www.sec.gov/rules/other/33-8056.htm
    - https://www.govinfo.gov/content/pkg/FR-2002-01-25/pdf/02-1899.pdf
    - https://www.sec.gov/Archives/edgar/data/1024401/000090951802000089/0000909518-02-000089.txt

