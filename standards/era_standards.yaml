- id: sox-2002
  title: Sarbanes-Oxley Act of 2002
  issuer: US Congress / SEC
  designation: Pub. L. 107-204 (§§101, 201, 302, 401, 402, 404, 906)
  category: audit_and_controls
  post_enron: true
  issued: "2002-07-30"
  effective: "2002-08-29"
  effective_note: >-
    Signed July 30, 2002. SEC §302 certification rules were adopted August 29,
    2002 for periodic reports covering periods ending on or after that date.
    §404 management reports and auditor attestation applied to accelerated
    filers for fiscal years ending on or after November 15, 2004.
  superseded_by: null
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    The statutory response to Enron and WorldCom. It requires CEO/CFO
    certification (§302/§906) and management assessment and auditor
    attestation of ICFR (§404), and created the PCAOB (§101). It also banned
    most non-audit services to audit clients (§201), required MD&A disclosure
    of off-balance-sheet arrangements (§401(a)) and banned executive loans
    (§402).
  process_areas: [audit_controls, consolidation_reporting, regulatory_reporting, accounting_r2r]
  today:
    codification: SOX; Regulation S-K Items 307/308; Exchange Act Rules 13a-14, 13a-15
    note: >-
      Fully in force. ICFR is assessed against COSO 2013 and audited under
      PCAOB AS 2201. Non-accelerated filers are exempt from §404(b)
      attestation (Dodd-Frank §989G).
  sources:
    - https://www.sec.gov/newsroom/press-releases/2002-128-commission-approves-rules-implementing-provisions-sarbanes-oxley-act-accelerating-periodic-filings
    - https://www.perkinscoie.com/en/news-insights/recent-sec-final-rules-ceo-and-cfo-certification-of-periodic.html
    - https://www.sec.gov/divisions/corpfin/cfalerts/cfalert030405.htm

- id: pcaob-as-2201
  title: An Audit of Internal Control Over Financial Reporting That Is Integrated with An Audit of Financial Statements
  issuer: PCAOB
  designation: PCAOB AS 2201 (originally Auditing Standard No. 5; predecessor AS No. 2, 2004)
  category: audit_and_controls
  post_enron: true
  issued: "2007-07-27"
  effective: "2007-11-15"
  effective_note: >-
    The SEC approved AS No. 5 on July 27, 2007 (Release 34-56152), effective
    for fiscal years ending on or after November 15, 2007. It superseded AS
    No. 2 (2004). It was renumbered AS 2201 in the PCAOB reorganization
    effective December 31, 2016.
  superseded_by: null
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    Under SOX, the PCAOB took auditing standard-setting for public companies
    from the AICPA, whose self-regulation had failed with Andersen. The
    integrated ICFR audit would test the kinds of entity-level and
    management-override controls (related-party approvals, SPE structuring,
    valuation reserves) that failed at Enron.
  process_areas: [audit_controls]
  today:
    codification: PCAOB AS 2201
    note: >-
      Current standard. A top-down, risk-based audit of ICFR integrated with
      the financial statement audit, with later amendments.
  sources:
    - https://pcaobus.org/oversight/standards/archived-standards/details/Auditing_Standard_5
    - https://pcaobus.org/oversight/standards/auditing-standards/details/AS2201
    - https://www.morganlewis.com/blogs/financialreporting/2015/05/pcaobs-reorganization-of-auditing-standards-will-change-references-to-auditing-standards

