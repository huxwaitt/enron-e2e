- id: puhca-1935
  title: Public Utility Holding Company Act of 1935
  issuer: SEC
  designation: PUHCA 1935 (15 U.S.C. 79 et seq.); §3(a)(1) exemption via Rule 2 statement
  category: regulatory_reporting
  post_enron: false
  issued: "1935"
  effective: null
  effective_note: >-
    Enacted 1935. Enron became a public-utility holding company when it
    acquired Portland General in July 1997. It reorganized as an Oregon
    corporation and claimed the intrastate exemption under §3(a)(1) by Rule
    2 filings.
  superseded_by: PUHCA 2005 (Energy Policy Act of 2005; PUHCA 1935 repealed effective February 8, 2006)
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Shaped Enron's corporate structure (Oregon incorporation, hence "ENRON
    CORP/OR/" on EDGAR) and kept it out of SEC holding-company regulation. The
    SEC denied Enron's exemption applications on December 29, 2003, finding
    PGE had substantial interstate sales and out-of-state assets. Enron then
    operated as a PUHCA holding company subject to SEC financing orders during
    bankruptcy.
  process_areas: [regulatory_reporting, treasury, consolidation_reporting]
  today:
    codification: PUHCA 2005; 18 CFR Part 366
    note: >-
      PUHCA 1935 was repealed effective February 8, 2006. PUHCA 2005 replaced
      SEC structural regulation with FERC and state books-and-records access
      (18 CFR Part 366).
  sources:
    - https://www.sec.gov/files/rules/other/35-27809.pdf
    - https://www.projectfinance.law/publications/2004/february/sec-signals-tougher-stance-on-puhca-exemptions
    - https://mondaq.com/unitedstates/oil-gas-electricity/36976/ferc-adopts-final-rules-under-new-public-utility-holding-company-act
    - https://www.wiley.law/newsletter-936
  unverified: true
  unverified_fields: [effective]

