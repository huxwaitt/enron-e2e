- id: sab-99
  title: Materiality
  issuer: SEC
  designation: Staff Accounting Bulletin No. 99 (SAB Topic 1.M)
  category: audit_and_controls
  post_enron: false
  issued: "1999-08-12"
  effective: "1999-08-12"
  effective_note: >-
    Staff guidance effective on issuance. It rejected exclusive reliance on
    numerical thresholds (such as 5%) and required qualitative factors.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Framed the materiality calls in Enron's 2001 close. Enron and Andersen
    concluded, "using a qualitative analysis", that the $1 billion overstated
    equity from the Raptor notes receivable was not material enough to
    restate earlier quarters, and corrected it in Q3 2001 instead (Powers
    Report).
  process_areas: [audit_controls, accounting_r2r, consolidation_reporting]
  today:
    codification: SAB Topic 1.M; ASC 250-10-S99
    note: >-
      Still in force. It is applied alongside SAB 108 (2006, quantifying
      misstatements) and SOX §404 deficiency evaluation.
  sources:
    - https://www.sec.gov/interps/account/sab99.htm
    - https://www.sec.gov/Archives/edgar/data/1024401/000090951802000089/0000909518-02-000089.txt

- id: sec-auditor-independence-2000
  title: Revision of the Commission's Auditor Independence Requirements
  issuer: SEC
  designation: Release Nos. 33-7919; 34-43602 (Regulation S-X Rule 2-01)
  category: audit_and_controls
  post_enron: false
  issued: null
  effective: "2001-02-05"
  effective_note: >-
    Published at 65 FR 76008 (December 5, 2000) and effective February 5,
    2001. A transition period to August 5, 2002 applied to appraisal and
    valuation services and to internal audit outsourcing. The adoption date
    (November 2000) was not confirmed to the day.
  superseded_by: SOX §201 and the 2003 SEC independence rules
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    In force for Andersen's last Enron engagement (FY2001). It listed internal
    audit outsourcing and valuation services among non-audit services that can
    impair independence, but allowed them during a transition period. Andersen
    combined audit work with extensive structuring advice for Enron.
  process_areas: [audit_controls]
  today:
    codification: Regulation S-X Rule 2-01; SOX §201; PCAOB Rule 3524/3525 (audit committee pre-approval)
    note: >-
      SOX §201 prohibited internal audit outsourcing, valuation and other
      services for audit clients outright, and §301 required audit committee
      pre-approval of permitted services.
  sources:
    - https://www.sec.gov/rules/final/33-7919.htm
    - https://www.govinfo.gov/link/fr/65/76082
  unverified: true
  unverified_fields: [issued]

- id: coso-1992
  title: Internal Control - Integrated Framework
  issuer: COSO
  designation: COSO Internal Control - Integrated Framework (1992)
  category: audit_and_controls
  post_enron: false
  issued: "1992"
  effective: null
  effective_note: >-
    A voluntary framework published in 1992 with five components: control
    environment, risk assessment, control activities, information and
    communication, and monitoring. It has no effective date.
  superseded_by: COSO Internal Control - Integrated Framework (2013), released May 14, 2013
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The reference model for internal control in Enron's era. There was no
    public-company requirement to assess or attest to it, so failures such as
    the LJM approval controls (the Powers Report's "control" findings) were
    not externally reported.
  process_areas: [audit_controls]
  today:
    codification: COSO 2013 (used as the criteria for SOX §404 and PCAOB AS 2201)
    note: >-
      The 2013 update kept the five components and codified 17 principles.
      Most US registrants use it as the suitable framework for management's
      §404(a) assessment.
  sources:
    - https://www.coso.org/_files/ugd/3059fc_8fdac5b8011e4cd08d566bf40b1ac2a8.pdf
    - https://www.iasplus.com/en/othernews/global/coso-framework

