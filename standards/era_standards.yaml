- id: isda-1992-master
  title: 1992 ISDA Master Agreement (Multicurrency-Cross Border)
  issuer: ISDA
  designation: 1992 ISDA Master Agreement (Multicurrency-Cross Border) and Schedule
  category: contracts_master_agreements
  post_enron: false
  issued: "1992"
  effective: null
  effective_note: >-
    Published 1992 (ISDA issued Local Currency-Single Jurisdiction and
    Multicurrency-Cross Border forms). Each counterparty relationship takes
    effect on execution, so there is no single effective date.
  superseded_by: 2002 ISDA Master Agreement (published early 2003)
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The standard master for Enron's financial swaps and options (commodity,
    interest rate, currency, equity). Its Schedule terms (Specified Entities,
    cross-default thresholds, Additional Termination Events tied to credit
    ratings, Market Quotation vs Loss) set Enron's exposure. Enron's
    December 2, 2001 Chapter 11 filing was a Bankruptcy Event of Default
    under its counterparties' masters.
  process_areas: [confirmation, credit, settlement, treasury, deal_capture]
  today:
    codification: 2002 ISDA Master Agreement (1992 form still used for legacy relationships)
    note: >-
      The 2002 form replaced Market Quotation/Loss with a single Close-out
      Amount, shortened grace periods and added set-off. Most new
      relationships use it, overlaid by ISDA protocols and Dodd-Frank or EMIR
      requirements.
  sources:
    - https://isda.org/book/comparison-between-the-1992-and-2002-isda-master-agreement
    - https://www.mondaq.com/unitedstates/commoditiesderivativesstock-exchanges/19843/the-2002-isda-master-agreement
    - https://faegredrinker.com/en/insights/publications/2018/5/isda-master-agreement-closeout-provisions-english-courts-highlight-a-difference-between-the-1992-and
    - https://www.sec.gov/files/rules/other/35-27809.pdf

- id: isda-1993-commodity-definitions
  title: 1993 ISDA Commodity Derivatives Definitions (and 2000 Supplement)
  issuer: ISDA
  designation: 1993 ISDA Commodity Derivatives Definitions; 2000 Supplement
  category: contracts_master_agreements
  post_enron: false
  issued: "1993"
  effective: null
  effective_note: >-
    Published 1993. The 2000 Supplement replaced Article 7 and is incorporated
    by reference in confirmations ("as supplemented by the 2000 Supplement").
    The exact publication dates were not confirmed.
  superseded_by: 2005 ISDA Commodity Definitions
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Supplied the definitions (Commodity Reference Prices, Pricing Dates,
    averaging, Market Disruption Events) used in the confirmations for Enron's
    cash-settled gas, power and oil swaps and options. Those terms map to
    deal-capture fields in the trading spreadsheets.
  process_areas: [confirmation, deal_capture, settlement, risk_and_valuation]
  today:
    codification: 2005 ISDA Commodity Definitions
    note: >-
      The 2005 Commodity Definitions are the market standard for new
      commodity confirmations.
  sources:
    - https://www.isda.org/book/2000-supplement-to-1993-commodity-definitions/
    - https://tdsecurities.com/tds/document/1993-ISDA-Commodity-Derivatives-Definitions
    - https://www.isda.org/a/31IDE/Letter-Agreement-on-2005-Commodity-Definitions.doc
  unverified: true
  unverified_fields: [issued_exact_date]

- id: isda-1994-csa-ny
  title: 1994 ISDA Credit Support Annex (Security Interest - New York Law)
  issuer: ISDA
  designation: 1994 ISDA Credit Support Annex (NY law)
  category: contracts_master_agreements
  post_enron: false
  issued: "1994"
  effective: null
  effective_note: >-
    Published 1994 as an annex to the Schedule of an ISDA Master under New
    York law. The exact publication date was not confirmed.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Governed collateral (thresholds, minimum transfer amounts, eligible
    collateral, rating-linked thresholds) on Enron's ISDA relationships.
    Under rating-linked thresholds a downgrade raises collateral calls, which
    is why Enron's credit ratings were central to its liquidity in late 2001
    (the specific CSA terms of Enron's relationships were not verified).
  process_areas: [credit, treasury, settlement]
  today:
    codification: 1994 ISDA CSA (NY law); ISDA 2016 Credit Support Annex for Variation Margin
    note: >-
      Still used. Regulatory uncleared-margin rules created the 2016 VM CSA
      (and IM documents), largely replacing negotiated thresholds for covered
      entities.
  sources:
    - https://www.nomura.com/americas/df-disclosures/credit-support-doc.shtml
    - https://www.isda.org/books
  unverified: true
  unverified_fields: [issued_exact_date]

- id: eei-master-2000
  title: EEI Master Power Purchase and Sale Agreement (with Collateral Annex)
  issuer: EEI
  designation: EEI Master Power Purchase & Sale Agreement, Version 2.1 (modified 4/25/00), EEI/NEM copyright
  category: contracts_master_agreements
  post_enron: false
  issued: "2000-04-25"
  effective: null
  effective_note: >-
    Drafted from January 1999 by an EEI working group of more than 80
    companies, and published as Version 2.1 dated April 25, 2000 (copyright
    EEI and National Energy Marketers Association). It applies per
    counterparty on execution.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The new standard master for physical wholesale power in 2000-2001,
    replacing utility-specific forms. Its confirmation and Schedule P product
    definitions (Firm LD, Unit Firm, etc.), collateral annex and
    early-termination netting governed EPMI's power trades and the
    termination claims after Enron's bankruptcy.
  process_areas: [confirmation, deal_capture, credit, settlement, scheduling_logistics]
  today:
    codification: EEI Master Agreement v2.1 with Collateral Annex and published amendments/errata
    note: >-
      Still the dominant North American physical power master. EEI added an
      errata and guidance after the CFMA and later swap rules.
  sources:
    - https://eei.org/resources-and-media/master-contract
    - https://ppp.worldbank.org/node/9416
    - https://cms.eei.org/resources-and-media/master-contract/miscellaneous-optional

- id: gisb-base-contract-1996
  title: GISB Base Contract for Short-Term Sale and Purchase of Natural Gas
  issuer: GISB/NAESB
  designation: Form GISB-BC-2/13/96 with General Terms and Conditions GISB-GTC-2/13/96 (later v1.5 dated Jan 7, 2000)
  category: contracts_master_agreements
  post_enron: false
  issued: "1996-02-13"
  effective: null
  effective_note: >-
    The form is dated February 13, 1996. NAESB materials also refer to a
    version dated May 13, 1996, and version 1.5 is dated January 7, 2000. It
    applies per counterparty on execution.
  superseded_by: NAESB Base Contract for Sale and Purchase of Natural Gas (April 19, 2002; current version September 5, 2006)
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The industry-standard short-term physical gas contract during Enron's gas
    merchant era. Its elections (oral vs written transaction procedure,
    confirm deadline of 2 business days, Cover Standard vs Spot Price
    Standard, payment date) correspond to fields in physical gas deal capture
    and confirmation.
  process_areas: [confirmation, deal_capture, settlement, scheduling_logistics, credit]
  today:
    codification: NAESB Base Contract (2006)
    note: >-
      Replaced by the NAESB Base Contract (2002, then 2006), which supports
      long-term deals and was revised after Enron. Parties may still use
      earlier versions.
  sources:
    - https://naesb.org//pdf/Gisbsale.pdf
    - https://www.naesb.org/pdf/042302pr.pdf
    - https://www.haynesboone.com/news/publications/mai-in-thomson-reuters-understanding-the-naesb-base-contract-for-sale-and-purchase-of-natural-gas

