- id: ferc-order-636
  title: Pipeline Service Obligations and Revisions to Regulations Governing Self-Implementing Transportation; Restructuring of Interstate Natural Gas Pipeline Services
  issuer: FERC
  designation: FERC Order No. 636 (Docket RM91-11)
  category: energy_trading
  post_enron: false
  issued: "1992-04-09"
  effective: null
  effective_note: >-
    Final rule issued April 1992, implemented through pipeline-specific
    restructuring proceedings. The effective and implementation dates were not
    confirmed.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Required pipelines to unbundle merchant sales from transportation. That
    created the open-access capacity and spot gas markets that Enron's gas
    trading, transport-capacity trading and EnronOnline relied on. Enron's
    own pipelines (Northern Natural, Transwestern) became open-access
    transporters. Order No. 637 (February 9, 2000) later revised
    capacity-release rules.
  process_areas: [scheduling_logistics, deal_capture, regulatory_reporting]
  today:
    codification: 18 CFR Part 284
    note: >-
      Still the foundation of US gas transportation (18 CFR Part 284), built on
      by Order 637 and the Order 587 business-practice series.
  sources:
    - https://webarchive.library.unt.edu/web/20090825044458/http://www.ferc.gov/legal/maj-ord-reg.asp
    - https://webarchive.library.unt.edu/eot2008/20090116053707/http://ferc.gov/students/whatisferc/history.htm
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt
  unverified: true
  unverified_fields: [effective]

- id: ferc-order-888-889
  title: Promoting Wholesale Competition Through Open Access Non-discriminatory Transmission Services (888); Open Access Same-Time Information System and Standards of Conduct (889)
  issuer: FERC
  designation: FERC Order Nos. 888 and 889
  category: energy_trading
  post_enron: false
  issued: "1996-04-24"
  effective: null
  effective_note: >-
    Issued April 24, 1996. Rehearing orders 888-A and 889-A followed in March
    1997. The effective date of the original rule was not confirmed.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Open-access transmission tariffs and OASIS made multi-utility wholesale
    power trading possible, the market Enron Power Marketing traded in. It
    also governed the transmission reservations and scheduling behind the
    power deals in the corpus.
  process_areas: [scheduling_logistics, deal_capture, regulatory_reporting]
  today:
    codification: 18 CFR Part 35 (pro forma OATT); 18 CFR Part 37 (OASIS)
    note: >-
      Reformed by Order No. 890 (2007) and Order No. 1000 (2011). RTOs and ISOs
      (Order No. 2000, December 1999) now run most transmission markets.
  sources:
    - https://www.ferc.gov/history-oatt-reform
    - https://ferc.gov/industries-data/electric/industry-activities/open-access-transmission-tariff-oatt-reform/history-oatt-reform/order-no-888
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt
  unverified: true
  unverified_fields: [effective]

- id: ca-ab-1890
  title: California Electric Utility Industry Restructuring Act (creating the CalPX and CAISO)
  issuer: California Legislature / CPUC
  designation: Assembly Bill 1890 (Stats. 1996, ch. 854)
  category: energy_trading
  post_enron: false
  issued: "1996-09-23"
  effective: "1998-03-31"
  effective_note: >-
    Signed September 23, 1996. The statute targeted January 1, 1998 for the
    Power Exchange and ISO. Sources give March 1, March 31 or April 1, 1998
    for actual market start; March 31, 1998 (EIA) is used here as
    approximate.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Created the CalPX day-ahead and CAISO real-time markets that Enron's West
    Power desk traded and scheduled into during the 2000-01 crisis. FERC
    staff's March 26, 2003 report found that many of Enron's strategies broke
    the CAISO/PX tariffs' anti-gaming provisions. FERC then revoked Enron's
    market-based rate authority.
  process_areas: [scheduling_logistics, deal_capture, settlement, regulatory_reporting]
  today:
    codification: CAISO tariff (FERC-jurisdictional); FERC anti-manipulation rule 18 CFR 1c (EPAct 2005)
    note: >-
      The CalPX ceased operating in the crisis. CAISO now runs integrated
      day-ahead and real-time markets. FERC gained explicit anti-manipulation
      authority in EPAct 2005.
  sources:
    - https://www.eia.gov/electricity/policies/legislation/california/assemblybill.html
    - https://docs.cpuc.ca.gov/published/FINAL_DECISION/5530.htm
    - https://webarchive.library.unt.edu/eot2008/20090114221159/http:/www.ferc.gov/news/news-releases/2003/2003-1/report3-26x.pdf
    - https://www.power-eng.com/gas/energy-commission-revokes-enrons-market-based-rate-authority/
  unverified: true
  unverified_fields: [effective]

- id: cftc-1993-exemptions
  title: CFTC exemptions for swap agreements (Part 35) and for certain energy contracts
  issuer: CFTC
  designation: 17 CFR Part 35 (58 FR 5594, Jan 22, 1993); Energy exemption (58 FR 21286, Apr 20, 1993)
  category: energy_trading
  post_enron: false
  issued: "1993-01-22"
  effective: null
  effective_note: >-
    The Part 35 swap exemption was published January 22, 1993. The energy
    contracts exemption (deferred purchase or sale of specified energy
    products between commercial parties) followed on April 20, 1993. The
    CFTC reaffirmed both in December 2000. The rules' formal effective dates
    were not confirmed (Federal Register publication dates are shown).
  superseded_by: cfma-2000 (statutory exclusions/exemptions); later Dodd-Frank Title VII
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Kept Enron's OTC energy swaps and forwards outside exchange-style CFTC
    regulation before the CFMA. That made the bilateral master-agreement
    model (ISDA, EEI, GISB) the main control framework for Enron's wholesale
    book.
  process_areas: [deal_capture, confirmation, credit, regulatory_reporting]
  today:
    codification: Commodity Exchange Act as amended by Dodd-Frank Title VII; 17 CFR Parts 23, 43, 45
    note: >-
      Swaps are now CFTC-regulated: swap dealer registration, clearing and
      trade-execution mandates, margin, and SDR reporting. The forward
      contract exclusion still covers physically settled commercial forwards.
  sources:
    - https://www.cftc.gov/About/HistoryoftheCFTC/history_1990s.html
    - https://www.cftc.gov/sites/default/files/foia/fedreg00/foi001213e.htm
    - https://govinfo.gov/content/pkg/CFR-2001-title17-vol1/pdf/CFR-2001-title17-vol1-part35.pdf
  unverified: true
  unverified_fields: [effective]

- id: cfma-2000
  title: Commodity Futures Modernization Act of 2000
  issuer: US Congress / CFTC
  designation: Pub. L. 106-554 (CEA §2(h) exempt commodities - the "Enron loophole")
  category: energy_trading
  post_enron: false
  issued: "2000-12-21"
  effective: "2000-12-21"
  effective_note: >-
    Enacted December 21, 2000 as part of Pub. L. 106-554. New CEA §2(h)
    exempted bilateral trades in exempt commodities (energy, metals) between
    eligible commercial entities, and trades on electronic trading facilities
    (exempt commercial markets), from most CFTC regulation.
  superseded_by: dodd-frank-title-vii
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The "Enron loophole". Enron and other energy traders sought the exemption,
    and it left EnronOnline, Enron's principal-to-principal electronic
    platform launched in late 1999 (2000 10-K), largely outside CFTC
    oversight in 2001.
  process_areas: [deal_capture, confirmation, regulatory_reporting, credit]
  today:
    codification: CEA as amended by Dodd-Frank Title VII; 17 CFR Parts 37, 43, 45
    note: >-
      Closing the loophole was legislated in 2008, and Dodd-Frank (2010)
      brought energy swaps under CFTC swap regulation. Electronic venues are
      now SEFs or DCMs.
  sources:
    - https://www.everycrsreport.com/reports/RS22912.html
    - https://www.risk.net/exchanges/1511785/bid-close-enron-loophole
    - https://www.ogj.com/general-interest/article/17275516/cftc-increases-its-exempt-commercial-market-oversight

- id: dodd-frank-title-vii
  title: Dodd-Frank Wall Street Reform and Consumer Protection Act, Title VII (Wall Street Transparency and Accountability)
  issuer: US Congress / CFTC
  designation: Pub. L. 111-203, Title VII; CFTC Parts 43 (real-time reporting) and 45 (swap data recordkeeping and reporting)
  category: regulatory_reporting
  post_enron: true
  issued: "2010-07-21"
  effective: "2012-03-09"
  effective_note: >-
    Signed July 21, 2010. The CFTC Part 43 final rule (77 FR 1182, January 9,
    2012) took effect March 9, 2012, and the Part 45 final rule was published
    January 13, 2012 (77 FR 2136). Compliance was phased in by asset class and
    counterparty type. Both parts were substantially amended in 2020.
  superseded_by: null
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    Closed the regulatory gap that EnronOnline and Enron's OTC swap book
    operated in. Energy swaps are now reported to swap data repositories with
    unique identifiers, and dealers face capital, margin and business-conduct
    rules. Deal capture now has a regulatory reporting obligation that did
    not exist in 2001.
  process_areas: [deal_capture, confirmation, regulatory_reporting, credit]
  today:
    codification: CEA §§2(a)(13), 4r; 17 CFR Parts 43, 45, 49
    note: >-
      Current regime. Part 43 requires public real-time price reporting and
      Part 45 regulatory reporting to an SDR. Credit Support Annexes were
      reworked for uncleared margin rules.
  sources:
    - https://www.cftc.gov/LawRegulation/FederalRegister/FinalRules/2011-33199.html
    - https://www.cftc.gov/LawRegulation/FederalRegister/FinalRules/2011-33173.html
    - https://www.cftc.gov/LawRegulation/FederalRegister/finalrules/2020-21570.html

- id: ferc-order-2001
  title: Revised Public Utility Filing Requirements (Electric Quarterly Reports)
  issuer: FERC
  designation: FERC Order No. 2001 (Docket RM01-8)
  category: regulatory_reporting
  post_enron: true
  issued: "2002-04-25"
  effective: "2002-04-01"
  effective_note: >-
    Issued April 25, 2002 and effective 60 days later. The first EQR (interim
    format) covered April 1 - June 30, 2002 and was due July 31, 2002. It
    replaced power marketers' quarterly transaction reports and the filing of
    long-term agreements.
  superseded_by: null
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    In 2001 Enron Power Marketing reported its market-based-rate sales to
    FERC through summary quarterly transaction reports. The EQR requires
    contract-level and transaction-level data, which the western markets
    investigation that followed the 2000-01 crisis lacked.
  process_areas: [regulatory_reporting, deal_capture, settlement]
  today:
    codification: 18 CFR 35.10b (Electric Quarterly Reports)
    note: >-
      Still required of public utilities with market-based rate authority,
      with data dictionary revisions over time.
  sources:
    - https://webarchive.library.unt.edu/web/20080916192326/http://ferc.gov/docs-filing/eqr/news-help/require-guide.pdf
    - https://www.govinfo.gov/content/pkg/FR-2002-05-08/pdf/02-10806.pdf
    - https://webarchive.library.unt.edu/eot2008/20081105043216/http://edocket.access.gpo.gov/2008/E8-26209.htm

- id: ferc-price-index-policy-2003
  title: Policy Statement on Natural Gas and Electric Price Indices
  issuer: FERC
  designation: Docket No. PL03-3-000; 104 FERC ¶ 61,121 (2003)
  category: market_conventions
  post_enron: true
  issued: "2003-07-24"
  effective: "2003-07-24"
  effective_note: >-
    Issued July 24, 2003 and clarified in 2003 and 2005. It set standards for
    index developers and for companies reporting trades to them, with a
    rebuttable-presumption safe harbor. A codification was proposed in 2021
    and a revised policy issued in 2022.
  superseded_by: null
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    The after picture for the index-priced deals in the Enron corpus. In 2001
    trade data reached Inside FERC and Gas Daily through informal trader
    reporting with little verification. The 2003 policy requires
    independent back-office reporting, a code of conduct and data
    retention.
  process_areas: [deal_capture, risk_and_valuation, settlement, regulatory_reporting]
  today:
    codification: 18 CFR 284.403 (code of conduct for reporting); FERC price index policy (revised 2022)
    note: >-
      Index reporting is now under FERC policy and the 18 CFR 284.403 code of
      conduct, together with EPAct 2005 anti-manipulation authority.
  sources:
    - https://webarchive.library.unt.edu/eot2008/20090114222131/http:/www.ferc.gov/news/news-releases/2003/2003-3/07-23-03-indexgas.pdf
    - https://www.govinfo.gov/content/pkg/FR-2021-03-02/pdf/2020-28386.pdf
    - https://www.law.cornell.edu/cfr/text/18/284.403

