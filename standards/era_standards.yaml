- id: fas-5
  title: Accounting for Contingencies
  issuer: FASB
  designation: SFAS No. 5
  category: accounting_disclosure
  post_enron: false
  issued: "1975-03"
  effective: "1976-01-01"
  effective_note: >-
    Issued March 1975; effective for fiscal years beginning on or after July
    1, 1975 (for a calendar-year company, January 1, 1976).
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Governed accrual and disclosure of loss contingencies, including
    guarantees and contingent support obligations given to off-balance-sheet
    structures and the litigation and regulatory exposures (for example
    California) that grew in 2001.
  process_areas: [accounting_r2r, consolidation_reporting, credit, treasury]
  today:
    codification: ASC 450
    note: >-
      Now ASC 450. Guarantees were split out by FIN 45 (ASC 460), which
      requires a liability at inception. Credit-loss guidance moved to ASC 326
      (CECL).
  sources:
    - https://storage.fasb.org/fas5.pdf
    - https://dart.deloitte.com/USDART/home/codification/liabilities/asc450-10/deloitte-s-roadmap-contingencies-loss-recoveries/chapter-1-overview/1-3-history-guidance-guarantees

- id: fin-45
  title: Guarantor's Accounting and Disclosure Requirements for Guarantees, Including Indirect Guarantees of Indebtedness of Others
  issuer: FASB
  designation: FASB Interpretation No. 45
  category: accounting_disclosure
  post_enron: true
  issued: "2002-11-25"
  effective: "2003-01-01"
  effective_note: >-
    Initial recognition and measurement applied prospectively to guarantees
    issued or modified after December 31, 2002. Disclosures applied to periods
    ending after December 15, 2002.
  superseded_by: null
  status_as_of_2001-12-31: not_yet_issued
  enron_relevance: >-
    Under SFAS 5, Enron's guarantees and make-whole commitments to SPE
    structures could stay off the balance sheet until a loss was probable.
    FIN 45 requires a liability at fair value when a guarantee is issued, and
    disclosure of maximum potential exposure.
  process_areas: [accounting_r2r, credit, treasury, consolidation_reporting]
  today:
    codification: ASC 460
    note: >-
      Codified in ASC 460 and largely unchanged. It interprets FAS 5, 57 and
      107 and rescinded FIN 34.
  sources:
    - https://storage.fasb.org/aop_FIN45.pdf
    - https://dart.deloitte.com/USDART/home/codification/liabilities/asc450-10/deloitte-s-roadmap-contingencies-loss-recoveries/chapter-1-overview/1-3-history-guidance-guarantees

- id: fas-121
  title: Accounting for the Impairment of Long-Lived Assets and for Long-Lived Assets to Be Disposed Of
  issuer: FASB
  designation: SFAS No. 121
  category: accounting_recognition
  post_enron: false
  issued: "1995-03"
  effective: "1996-01-01"
  effective_note: >-
    Effective for financial statements for fiscal years beginning after
    December 15, 1995.
  superseded_by: SFAS No. 144 (August 2001; effective for fiscal years beginning after Dec 15, 2001)
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Governed impairment testing of Enron's long-lived assets: power plants,
    pipelines, international projects, water assets and the broadband fiber
    network.
  process_areas: [accounting_r2r, fpa, consolidation_reporting]
  today:
    codification: ASC 360-10
    note: >-
      SFAS 144 replaced it with a single model for impairment and disposal
      (ASC 360-10) and removed goodwill from its scope (goodwill moved to SFAS
      142 / ASC 350).
  sources:
    - https://storage.fasb.org/fas121.pdf
    - https://storage.fasb.org/fas144.pdf
    - https://www.journalofaccountancy.com/issues/2002/mar/assetimpairmentanddisposal/

- id: fas-142
  title: Goodwill and Other Intangible Assets
  issuer: FASB
  designation: SFAS No. 142
  category: accounting_recognition
  post_enron: false
  issued: "2001-06"
  effective: "2002-01-01"
  effective_note: >-
    Effective for fiscal years beginning after December 15, 2001. Goodwill
    and intangibles acquired after June 30, 2001 followed its
    non-amortization rules immediately.
  superseded_by: null
  status_as_of_2001-12-31: issued_not_yet_effective
  enron_relevance: >-
    Issued in Enron's final year. It would have ended goodwill amortization
    from January 1, 2002 and required annual impairment tests. Enron never filed a 2001 10-K, so
    it never reported under it.
  process_areas: [accounting_r2r, consolidation_reporting, fpa]
  today:
    codification: ASC 350
    note: >-
      Goodwill is not amortized by public entities and is tested for
      impairment at least annually (ASC 350). ASU 2017-04 simplified the test.
  sources:
    - https://storage.fasb.org/fas142.pdf
    - https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001024401&type=10-K&dateb=&owner=include&count=40

- id: fas-123
  title: Accounting for Stock-Based Compensation
  issuer: FASB
  designation: SFAS No. 123
  category: accounting_disclosure
  post_enron: false
  issued: "1995-10"
  effective: "1996-01-01"
  effective_note: >-
    Disclosure provisions effective for fiscal years beginning after December
    15, 1995. Entities could keep APB Opinion 25 intrinsic-value accounting
    and disclose pro forma fair-value expense instead.
  superseded_by: SFAS No. 123(R) (December 2004)
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    Enron applied APB Opinion 25, so no compensation expense was recognized
    for fixed stock option plans. Restricted stock expense was $220 million in
    2000, and fair-value expense for options appeared only as SFAS 123 pro
    forma disclosure. This bears on how heavily option-based Enron pay showed
    up in earnings.
  process_areas: [accounting_r2r, consolidation_reporting, tax]
  today:
    codification: ASC 718
    note: >-
      SFAS 123(R) eliminated the APB 25 alternative, so option fair value is
      expensed (ASC 718).
  sources:
    - https://storage.fasb.org/fas123.pdf
    - https://www.sec.gov/Archives/edgar/data/1024401/000102440101500010/ene10-k.txt

- id: fas-109
  title: Accounting for Income Taxes
  issuer: FASB
  designation: SFAS No. 109
  category: tax
  post_enron: false
  issued: "1992-02"
  effective: "1993-01-01"
  effective_note: >-
    Effective for fiscal years beginning after December 15, 1992.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The book-tax framework for deferred taxes on Enron's mark-to-market gains,
    which were taxed differently from book, and for the tax benefits of its
    structured transactions. The Joint Committee on Taxation staff (February
    2003, JCS-3-03) examined 12 large structured transactions Enron
    entered into from 1995 to 2001, many of them involving offshore entities.
  process_areas: [tax, accounting_r2r, consolidation_reporting]
  today:
    codification: ASC 740
    note: >-
      Now ASC 740. FIN 48 (2006) added recognition and measurement of
      uncertain tax positions, and tax-shelter disclosure (for example
      reportable-transaction rules) was strengthened after Enron.
  sources:
    - https://storage.fasb.org/fas109.pdf
    - https://www.jurist.org/news/2003/02/enron-tax-shelter-investigation-report/
    - https://www.finance.senate.gov/download/enron-the-joint-committee-on-taxations-investigative-report&download=1

- id: irc-475
  title: Mark to Market Accounting Method for Dealers in Securities (and elective MTM for commodities dealers/traders)
  issuer: IRS
  designation: Internal Revenue Code §475 (OBRA 1993 §13223; §475(e)-(f) added by Taxpayer Relief Act of 1997)
  category: tax
  post_enron: false
  issued: "1993"
  effective: null
  effective_note: >-
    §475 was enacted by the Omnibus Budget Reconciliation Act of 1993. The
    §475(e) commodities-dealer and §475(f) trader elections apply to taxable
    years ending after August 5, 1997 (Rev. Proc. 99-17 sets the election
    procedure). The effective date of the 1993 securities-dealer rule was not
    confirmed.
  superseded_by: null
  status_as_of_2001-12-31: in_force
  enron_relevance: >-
    The tax-side counterpart to EITF 98-10. A commodities dealer could elect
    under §475(e) to mark its energy book to market for tax, which matters for
    deferred tax on trading gains. Whether and when Enron entities made the
    election was not verified.
  process_areas: [tax, risk_and_valuation, accounting_r2r]
  today:
    codification: IRC §475; Treas. Reg. §1.475
    note: >-
      Still in force. The IRS issued a valuation safe harbor (2007 regulations)
      letting eligible taxpayers use financial-statement marks for §475.
  sources:
    - https://www.govinfo.gov/content/pkg/FR-1999-01-28/html/99-1787.htm
    - https://taxnotes.com/lr/resolve/rev-proc-99-17/dldc
    - https://regulations.justia.com/regulations/fedreg/2007/06/12/E7-11146.html
  unverified: true
  unverified_fields: [effective, enron_relevance]

