name: ci
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_units.py
      - name: ontology builds
        run: |
          pip install linkml
          linkml-lint --ignore-warnings ontology/enron_finance.yaml
          gen-owl ontology/enron_finance.yaml > /tmp/enron_finance.owl.ttl
