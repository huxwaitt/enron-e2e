[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enron-e2e"
version = "0.1.0"
description = "End-to-end finance data estate reconstructed around the Enron spreadsheet corpus"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "py7zr>=0.21",
  "pyyaml>=6",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
enron-e2e = "enron_e2e.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
