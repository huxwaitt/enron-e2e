# Weighted lexicon for the workbook classifier (gold.classify). Patterns are
# case-insensitive regexes. Field weights scale a hit by where it was found.
# Change a rule, rebuild, and diff gold/workbook_labels.parquet. The rules are versioned with the code.
version: 2
field_weights: {filename: 3.0, sheet_name: 2.0, header_text: 1.0, email_subject: 1.5}
min_score: 2.0

