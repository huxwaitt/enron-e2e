# Candidate market reference entities. `aliases` are case-insensitive regexes,
# matched on word boundaries against workbook cell text, sheet names and file names.
# The mining step (gold.reference) emits an instance only when an entry is observed,
# and attaches its observation counts as evidence. Unobserved entries are kept here
# as negative evidence.
pipelines:
  - {slug: northern-natural, label: Northern Natural Gas, aliases: ["northern natural", "\\bNNG\\b"], enron_owned: true}
  - {slug: transwestern, label: Transwestern Pipeline, aliases: ["transwestern", "\\bTW\\b"], enron_owned: true}
  - {slug: florida-gas, label: Florida Gas Transmission, aliases: ["florida gas", "\\bFGT\\b"], enron_owned: partial}
  - {slug: northern-border, label: Northern Border Pipeline, aliases: ["northern border"], enron_owned: partial}
  - {slug: el-paso, label: El Paso Natural Gas, aliases: ["el paso", "\\bEPNG\\b"]}
  - {slug: transco, label: Transcontinental Gas Pipe Line, aliases: ["transco"]}
  - {slug: tennessee, label: Tennessee Gas Pipeline, aliases: ["tennessee gas", "\\bTGP\\b", "\\bTENN\\b"]}
  - {slug: texas-eastern, label: Texas Eastern Transmission, aliases: ["texas eastern", "\\bTETCO\\b"]}
  - {slug: ngpl, label: Natural Gas Pipeline Co. of America, aliases: ["\\bNGPL\\b", "natural gas pipeline co"]}
  - {slug: anr, label: ANR Pipeline, aliases: ["\\bANR\\b"]}
  - {slug: panhandle, label: Panhandle Eastern Pipe Line, aliases: ["panhandle", "\\bPEPL\\b"]}
